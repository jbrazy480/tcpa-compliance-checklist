last_reviewed: '2026-09-26'
notice: Last reviewed 2026-09-26. Not legal advice. Laws change; confirm with counsel.
groups:
- title: Before you dial
  items:
  - id: scope
    title: Classify the campaign and technology
    detail: Document the seller, purpose, destination type, and whether the call uses
      an autodialer or artificial or prerecorded voice. Have counsel evaluate the
      actual equipment and exemptions; a product label is not a legal classification.
    citation: 47 CFR 64.1200(a)(1)-(3), (f)(2), (f)(12)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
  - id: consent_type
    title: Choose the applicable consent standard
    detail: Covered non-telemarketing artificial/prerecorded voice or autodialed calls
      to wireless numbers generally require prior express consent, subject to applicable
      exceptions. Commercial telemarketing calls using those technologies to wireless
      numbers generally require prior express written consent. Do not treat an inquiry
      or purchased lead as written consent.
    citation: 47 CFR 64.1200(a)(1)-(2)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
  - id: written_consent
    title: Review the written agreement
    detail: For covered telemarketing, preserve the signed written agreement, authorized
      telephone number, seller authorization and clear disclosure of artificial/prerecorded
      voice or autodialer calls. Consent cannot be required as a condition of purchase.
      Ask counsel to validate the actual form and signature evidence.
    citation: 47 CFR 64.1200(f)(9), (a)(2)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
  - id: residential
    title: Review residential artificial-voice calls separately
    detail: Telemarketing artificial/prerecorded voice calls to residential lines
      generally require prior express written consent. Non-telemarketing exceptions
      have their own conditions; do not transfer a wireless analysis without review.
    citation: 47 CFR 64.1200(a)(3)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
  - id: evidence
    title: Preserve consent evidence
    detail: 'Operational control: retain the exact disclosure version, timestamp with
      offset, source, phone, seller identity and retrievable signature/evidence reference.
      Optional IP and user-agent fields do not prove consent by themselves. The supplied
      schema checks structure only.'
    citation: 47 CFR 64.1200(f)(9), (c)(2)(ii)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
- title: AI voice specifics
  items:
  - id: ai_voice
    title: Treat AI-generated voices as artificial voices
    detail: FCC Declaratory Ruling FCC 24-17, adopted February 2 and released February
      8, 2024, confirms that AI-generated human voices fall within the TCPA artificial-voice
      restrictions. Live generation or a conversational interface does not remove
      those restrictions.
    citation: FCC 24-17, paragraphs 1 and 4-6
    url: https://docs.fcc.gov/public/attachments/FCC-24-17A1.pdf
  - id: ai_review
    title: Approve the AI use case before launch
    detail: 'Operational control: review the complete interaction, including generated
      speech, transfers and voicemail, against the applicable consent and identification
      requirements. Do not read the ruling as either a blanket ban on all AI calls
      or blanket permission after a checkbox.'
    citation: FCC 24-17; 47 CFR 64.1200(a), (b)
    url: https://docs.fcc.gov/public/attachments/FCC-24-17A1.pdf
- title: Calling hours
  items:
  - id: hours
    title: Enforce called-party local hours
    detail: Telephone solicitations to residential subscribers may not be placed before
      8 a.m. or after 9 p.m. at the called party location. Apply the wireless provisions
      where applicable. This toolkit conservatively excludes exactly 9 p.m. and can
      narrow the daily window.
    citation: 47 CFR 64.1200(c)(1), (e)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
  - id: location
    title: Verify location and stricter schedules
    detail: 'Operational control: verify the called party location; an area code is
      only a hint because people move and travel. Use a verified IANA timezone override
      where available. Recheck at dispatch, apply all candidate zones, and block unknown
      zones. A time pass does not authorize a call.'
    citation: 47 CFR 64.1200(c)(1)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
- title: National DNC Registry and internal DNC list
  items:
  - id: national_dnc
    title: Perform the separate National Registry check
    detail: Apply the National DNC restrictions and have counsel document any exception.
      For the routine-compliance error defense, the rule specifies a Registry version
      obtained no more than 31 days before calling, plus documented procedures. Internal-list
      scrubbing here does not query the Registry.
    citation: 47 CFR 64.1200(c)(2), especially (c)(2)(i)(D)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
  - id: registry_access
    title: Arrange authorized Registry access
    detail: Obtain access through the FTC telemarketing.donotcall.gov portal with
      a subscription account and applicable seller permissions. Do not reuse another
      seller access improperly. Record access and scrub dates.
    citation: 47 CFR 64.1200(c)(2)(i)(D)-(E); FTC Telemarketing Sales Rule guidance
    url: https://www.ftc.gov/business-guidance/resources/complying-telemarketing-sales-rule
  - id: internal_policy
    title: Publish and train on an internal DNC policy
    detail: Maintain a written DNC policy available on demand, train personnel, and
      implement the company-specific suppression process. Covered artificial/prerecorded
      residential exemption calls also have DNC procedures.
    citation: 47 CFR 64.1200(d)(1)-(2)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
  - id: internal_requests
    title: Capture requests at receipt
    detail: 'Record the request and telephone number when received, plus the name
      if provided. Honor covered requests within a reasonable time, no later than
      ten business days. Operational control: suppress immediately and propagate to
      the seller systems and authorized vendors.'
    citation: 47 CFR 64.1200(d)(3)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
  - id: internal_retention
    title: Maintain internal suppression records
    detail: Covered company-specific DNC requests must be honored for five years.
      Do not assume a continuing customer relationship overrides a seller-specific
      request. Review sharing and affiliated-entity scope before distributing suppression
      records.
    citation: 47 CFR 64.1200(d)(3), (d)(5)-(6), (f)(5)(i)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
- title: Identification and opt-out for artificial voice messages
  items:
  - id: identity
    title: Identify the responsible entity
    detail: At the beginning, clearly state the responsible entity identity, including
      its registered business name when applicable. During or after the message, give
      the required contact number; observe the callback and charge restrictions.
    citation: 47 CFR 64.1200(b)(1)-(2)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
  - id: interactive_optout
    title: Test the live opt-out mechanism
    detail: For messages covered by (b)(3), including telemarketing artificial/prerecorded
      voice messages, provide automated interactive voice and/or keypress opt-out
      with instructions within two seconds after identification. The mechanism must
      automatically record the number on the DNC list and immediately end the call.
    citation: 47 CFR 64.1200(b)(3)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
  - id: voicemail
    title: Test voicemail opt-out
    detail: For covered messages left on voicemail or answering machines, include
      a toll-free callback number connecting directly to the automated opt-out mechanism
      so the number is automatically recorded on the DNC list.
    citation: 47 CFR 64.1200(b)(3)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
- title: Caller ID
  items:
  - id: caller_id
    title: Transmit required caller identification
    detail: Telemarketing callers covered by this rule must transmit caller identification
      and may not block it. Ensure the provided number accepts DNC requests during
      regular business hours; review allowed seller-number substitution and exemptions.
    citation: 47 CFR 64.1601(e)
    url: https://www.ecfr.gov/current/title-47/section-64.1601
- title: Revocation of consent
  items:
  - id: revocation
    title: Accept reasonable revocation methods
    detail: 'Covered consent may be revoked through reasonable methods, not only a
      caller-selected channel. Operational control: capture spoken opt-outs, designated
      channels and other reasonable requests; stop queued calls immediately and record
      the request and handling evidence.'
    citation: 47 CFR 64.1200(a)(10)-(11); FCC 24-24
    url: https://www.ecfr.gov/current/title-47/section-64.1200
  - id: revocation_review
    title: Review current revocation scope and effective dates
    detail: Have counsel check current rules, waivers and orders for the campaign,
      including cross-category handling. Do not infer an operational deadline or exemption
      from the schema. A populated revoked_at field is historical evidence, not permission
      to call.
    citation: 47 CFR 64.1200(a)(10)-(12); FCC 24-24
    url: https://www.ecfr.gov/current/title-47/section-64.1200
- title: State laws
  items:
  - id: state_review
    title: Check every state you call
    detail: Several states impose stricter calling hours, registration or consent
      rules. Check each state you call and the caller jurisdiction with counsel before
      launch. Federal review alone is insufficient; this project deliberately supplies
      no state rules table or state-specific legal settings.
    citation: FCC 03-153, paragraphs 81-84; FTC Telemarketing Sales Rule guidance
      on state law
    url: https://www.ftc.gov/business-guidance/resources/complying-telemarketing-sales-rule
- title: Vendor and AI agent script review
  items:
  - id: vendors
    title: Assign seller and vendor responsibilities
    detail: 'Operational control: identify who obtains consent, maintains evidence,
      performs National Registry checks, updates internal suppression, handles revocation
      and responds to complaints. Verify actual behavior with test calls before enabling
      a campaign.'
    citation: 47 CFR 64.1200(c)(2)(i), (d)(3)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
  - id: scripts
    title: Review every script branch
    detail: 'Operational control: approve opening identity, contact number, opt-out
      instructions, generated responses, voicemail and transfer branches. Test that
      an opt-out works without a human agent and that queued attempts are suppressed.
      Reapprove material script or vendor changes.'
    citation: 47 CFR 64.1200(b)(1)-(3), (d)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
- title: Audit trail
  items:
  - id: audit
    title: Make decisions reproducible
    detail: 'Operational control: retain UTC check time, verified timezone source,
      configured window, list versions, result, consent evidence reference, script
      version and reviewer. Store evidence securely with access controls and a counsel-approved
      retention schedule. The CLI does not maintain this audit system.'
    citation: 47 CFR 64.1200(c)(2)(i), (d)(6), (f)(9)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
  - id: release
    title: Require human campaign approval
    detail: 'Operational control: record owner, review date, unresolved issues and
      counsel decisions before dispatch. Completed checklist statuses and passing
      software checks are not a legal clearance or a determination of valid consent.'
    citation: 47 CFR 64.1200(a)-(d)
    url: https://www.ecfr.gov/current/title-47/section-64.1200
